{% extends "base.html" %}
{% block title %}Set up your account · MK Timekeeping{% endblock %}
{% block content %}
<img src="/static/brand/logo-full.png" alt="Law Offices of Mary Kennedy" class="auth-logo">
<div class="card" style="max-width:480px;margin:20px auto 40px;">
  <h1>Set up your account</h1>
  <p class="muted small">Your email must already be on the roster — ask an admin to add you
    first if you get an error here.</p>
  <form method="post" action="/signup" class="formrow" style="flex-direction:column">
    <div style="width:100%">
      <label>Work email</label>
      <input type="email" name="email" required autofocus style="width:100%">
    </div>
    <div style="width:100%">
      <label>Choose a password (min 8 characters)</label>
      <input type="password" name="password" required minlength="8" style="width:100%">
    </div>
    <div style="width:100%">
      <label>Confirm password</label>
      <input type="password" name="confirm" required minlength="8" style="width:100%">
    </div>
    <div><button>Create account</button></div>
  </form>
  <p class="muted small" style="margin-top:14px">Already set up? <a href="/login">Sign in</a>.</p>
</div>
{% endblock %}
